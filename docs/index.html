
<!doctype html> <html> <head> <meta charset="utf-8"/> <meta name="viewport" content="width=device-width,initial-scale=1"/> <title>GBC APU + Joypad Demo</title> <style> body{font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial; padding:16px; background:#0b1020; color:#e6eef8} button{margin:6px;padding:10px 14px;font-size:16px;border-radius:8px;border:0;background:#1b6fff;color:white} .small{font-size:13px;opacity:.9} #log{margin-top:12px;font-family:monospace;background:#071022;padding:10px;border-radius:8px;max-height:200px;overflow:auto} header{display:flex;gap:12px;align-items:center} h1{font-size:16px;margin:0} </style> </head> <body> <header> <h1>GBC APU + Joypad Demo (JS-only)</h1> <div class="small">No download — single-click demo</div> </header> <div style="margin-top:12px"> <button id="startBtn">Start Audio / Run</button> <button id="pressA">Press A</button> <button id="releaseA">Release A</button> <span style="margin-left:12px" class="small">A mask = 0x01</span> </div> <div id="info" class="small" style="margin-top:10px">Status: idle</div> <div id="log" class="small"></div> <script> /* Minimal emulator-like APU + Joypad implemented in JS so you can run in Safari instantly. Implements: - APU registers FF11..FF14 (duty, envelope, freq low+high + trigger) - step_frame() simulates CPU frame cycles and generates samples at 44100 Hz - set_button(mask, pressed) updates joypad state - drain_apu_samples() returns Float32Array of generated samples */ (function(){ const CYCLES_PER_FRAME = 70224; // approx const CPU_CLOCK = 4194304; // Hz const SAMPLE_RATE = 44100; class JsApu { constructor(){ // regs mapped as FF10..FF3F but we only use FF11..FF14 (offsets 1..4) this.regs = new Uint8Array(0x30); this.phase = 0; this.sample_accum = 0; this.buffer = []; } // addr is full 0xFF10.. format read_reg(addr){ const idx = addr - 0xFF10; if(idx < 0 || idx >= this.regs.length) return 0; return this.regs[idx]; } write_reg(addr, val){ const idx = addr - 0xFF10; if(idx < 0 || idx >= this.regs.length) return; this.regs[idx] = val & 0xFF; } // tick by cycles, produce samples into buffer tick(cycles){ const seconds = cycles / CPU_CLOCK; if(seconds <= 0) return; this.sample_accum += seconds * SAMPLE_RATE; const toEmit = Math.floor(this.sample_accum); this.sample_accum -= toEmit; if(toEmit === 0) return; // read channel 1 regs (FF11..FF14) const nr11 = this.regs[0x01]; const nr12 = this.regs[0x02]; const nr13 = this.regs[0x03]; const nr14 = this.regs[0x04]; const ch1_enabled = (nr14 & 0x80) !== 0; const dutyBits = (nr11 >> 6) & 0x03; const duty = dutyBits === 0 ? 0.125 : dutyBits === 1 ? 0.25 : dutyBits === 2 ? 0.5 : 0.75; const volume = ((nr12 >> 4) & 0x0F) / 15; const freq_raw = (((nr14 & 0x07) << 8) | nr13) & 0x7FF; const freq = freq_raw >= 2048 ? 0 : 131072 / (2048 - freq_raw); for(let i=0;i<toEmit;i++){ let s = 0; if(ch1_enabled && freq > 0){ this.phase = (this.phase + freq / SAMPLE_RATE) % 1; const val = this.phase < duty ? (volume * 2 - 1) : (-(volume * 2 - 1)); s = val; } this.buffer.push(s); } } drain_samples(){ const out = new Float32Array(this.buffer); this.buffer = []; return out; } } class JsJoypad { constructor(){ // bits 0..3: A,B,Select,Start (0 = pressed) // bits 4..7: Right,Left,Up,Down this.buttons = 0xFF; // all released (1) this.p1_select = 0x00; } set_button(mask, pressed){ if(pressed) this.buttons &= ~mask; else this.buttons |= mask; } read_p1(){ // For simplicity we ignore selection bits and return low nibble // but preserve selection bits in position 4..5 return (this.p1_select & 0x30) | (this.buttons & 0x0F); } write_p1(val){ this.p1_select = val & 0x30; } } class JsEmulator { constructor(){ this.apu = new JsApu(); this.joypad = new JsJoypad(); // emulate 65536 bytes of memory only for IO view this.ram = new Uint8Array(0x10000); // initialize P1 mirrored this.ram[0xFF00] = this.joypad.read_p1(); } // mimic load_rom but not used here load_rom(){} // step_frame: execute many small CPU steps; we just advance APU based on total cycles step_frame(){ // We'll simulate a single big CPU run of CYCLES_PER_FRAME cycles, // but mirror peripheral state into RAM before and after as the Rust code does. this.ram[0xFF00] = this.joypad.read_p1(); // Mirror APU regs FF10..FF3F into ram for(let addr = 0xFF10; addr <= 0xFF3F; addr++){ this.ram[addr] = this.apu.read_reg(addr); } // Simulate CPU executing CYCLES_PER_FRAME cycles in one go (fast) // and tick the APU with that many cycles. this.apu.tick(CYCLES_PER_FRAME); // propagate writes back (if JS code ever wrote to ram) const p1v = this.ram[0xFF00]; this.joypad.write_p1(p1v); for(let addr = 0xFF10; addr <= 0xFF3F; addr++){ const v = this.ram[addr]; this.apu.write_reg(addr, v); } } drain_apu_samples(){ return this.apu.drain_samples(); } set_button(mask, pressed){ this.joypad.set_button(mask, pressed); this.ram[0xFF00] = this.joypad.read_p1(); } } // UI + audio plumbing const logEl = document.getElementById('log'); const info = document.getElementById('info'); let emu = new JsEmulator(); let audioCtx = null; let running = false; let intervalId = null; function log(msg){ const t = new Date().toLocaleTimeString(); logEl.textContent = '['+t+'] '+msg + '\n' + logEl.textContent; } document.getElementById('startBtn').addEventListener('click', async () => { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); await audioCtx.resume(); if(running) { info.textContent = 'Status: already running'; return; } running = true; info.textContent = 'Status: running'; log('Started'); // Pre-fill some APU registers to make an audible tone by default // NR11 (FF11) duty/length: duty = 2 -> 50% emu.apu.write_reg(0xFF10 + 0x01, 0x80); // NR12 (FF12) volume envelope: volume = 15 (0xF0) emu.apu.write_reg(0xFF10 + 0x02, 0xF0); // NR13 (FF13) freq low emu.apu.write_reg(0xFF10 + 0x03, 0x00); // NR14 (FF14) freq hi + trigger (enable) emu.apu.write_reg(0xFF10 + 0x04, 0x87); intervalId = setInterval(() => { try { emu.step_frame(); const samples = emu.drain_apu_samples(); if(samples && samples.length){ // create buffer and play const buf = audioCtx.createBuffer(1, samples.length, 44100); buf.getChannelData(0).set(samples); const src = audioCtx.createBufferSource(); src.buffer = buf; src.connect(audioCtx.destination); src.start(); } } catch(e){ log('Error during frame: '+e); clearInterval(intervalId); running = false; } }, 16); }); document.getElementById('pressA').addEventListener('click', () => { emu.set_button(0x01, true); log('A pressed (mask 0x01)'); }); document.getElementById('releaseA').addEventListener('click', () => { emu.set_button(0x01, false); log('A released (mask 0x01)'); }); })(); </script> </body> </html>
